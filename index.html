<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة والمطورة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        
        /* المربع الرئيسي الأول (الترحيب، الموسيقى، الشاشات) */
        .main-box { background: #1e1e1e; border: 2px solid #333; border-radius: 15px; padding: 20px; width: 90%; max-width: 500px; margin: 0 auto 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #00fff0; font-size: 26px; margin: 0 0 10px 0; }
        .welcome-text { font-size: 18px; color: #ffcc00; margin-bottom: 15px; font-weight: bold; }
        
        /* منطقة الشاشات المنفصلة بـحجم وسط مائل للكبير */
        .screens-container { display: flex; flex-direction: column; gap: 12px; margin: 15px 0; }
        .monitor-screen { background: #000; border: 1px solid #444; border-radius: 10px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
        
        /* حجم نصوص وأرقام الشاشات (وسط-كبير متناسق) */
        .screen-title { font-size: 16px; color: #aaa; font-weight: bold; margin: 0; }
        .screen-number { font-size: 28px; font-weight: bold; color: #00ffcc; margin: 0; font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }
        
        /* أزرار الخدمات داخل المربع (ترجمة وموسيقى) */
        .service-btn { background: #444; color: white; border: none; padding: 8px 15px; margin: 5px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .service-btn:hover { background: #555; }

        /* منطقة خيارات الوقت الاوتوماتيكية */
        .time-zone { margin: 25px auto; width: 90%; max-width: 500px; }
        .time-btn { background: #28a745; color: white; border: none; padding: 12px 20px; margin: 5px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .time-btn:hover { background: #218838; transform: scale(1.05); }
        
        /* عجلة الاختيار المخصص (ديزاين التطبيقات) */
        .custom-select-container { margin-top: 15px; }
        .custom-select { background: #222; color: #ffcc00; border: 2px solid #ffcc00; padding: 12px 25px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; outline: none; text-align: center; width: 180px; }
        
        /* شاشة عرض تشخيص الأخطاء بلون مميز داخل المربع عند الفحص */
        .diag-output { font-size: 14px; margin-top: 15px; color: #ff4d4d; font-weight: bold; min-height: 20px; padding: 5px; }

        /* زر الفحص بالخط الأزرق بالأسفل خارج المربع */
        .check-link { display: inline-block; color: #00a2ff; background: none; border: none; font-size: 16px; font-weight: bold; text-decoration: underline; cursor: pointer; margin-top: 25px; transition: 0.2s; }
        .check-link:hover { color: #00c3ff; }
    </style>
</head>
<body>

    <div class="main-box">
        <h1>لوحة التحكم الذكية</h1>
        <div class="welcome-text" id="welcomeMsg">أهلاً وسهلاً بك في المنظومة 👋</div>
        
        <button class="service-btn" onclick="toggleMusic()">🎵 تشغيل/إيقاف الموسيقى</button>
        <button class="service-btn" onclick="triggerTranslation()">🌐 ترجمة الواجهة</button>
        
        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">

        <div class="screens-container">
            <div class="monitor-screen" id="screenMotion">
                <p class="screen-title" id="titleMotion">⏳ مؤقت الحركة:</p>
                <p class="screen-number" id="numMotion">00</p>
            </div>
            
            <div class="monitor-screen" id="screenRun">
                <p class="screen-title" id="titleRun">⚙️ عداد تشغيل المحرك:</p>
                <p class="screen-number" id="numRun">00</p>
            </div>
        </div>
        
        <div id="diagResult" class="diag-output"></div>
    </div>

    <div class="time-zone">
        <button class="time-btn" onclick="startAutomatedSystem(1)">1 ثانية</button>
        <button class="time-btn" onclick="startAutomatedSystem(10)">10 ثواني</button>
        <button class="time-btn" onclick="startAutomatedSystem(100)">100 ثانية</button>
        
        <div class="custom-select-container">
            <select id="customWheel" class="custom-select" onchange="handleWheelSelection()">
                <option value="" disabled selected>⏱️ وقت مخصص...</option>
                <script>
                    for(let i=1; i<=100; i++) {
                        document.write(`<option value="${i}">${i} ثانية</option>`);
                    }
                </script>
            </select>
        </div>
    </div>

    <button class="check-link" onclick="runDiagnosticCheck()">🔍 اضغط هنا لفحص أخطاء وتماسات النظام</button>

    <script>
        let countdownInterval = null;
        let runningInterval = null;
        let isMusicPlaying = false;
        let isArabic = true;

        function handleWheelSelection() {
            const selectedTime = document.getElementById('customWheel').value;
            if(selectedTime) {
                startAutomatedSystem(parseInt(selectedTime));
            }
        }

        function startAutomatedSystem(targetDuration) {
            clearInterval(countdownInterval);
            clearInterval(runningInterval);
            document.getElementById('diagResult').innerHTML = ""; 

            const numMotion = document.getElementById('numMotion');
            const numRun = document.getElementById('numRun');
            
            let motionDelay = 3; 
            numMotion.innerHTML = motionDelay;
            numMotion.style.color = "#ffcc00"; 
            numRun.innerHTML = "00";
            numRun.style.color = "#00ffcc";

            countdownInterval = setInterval(() => {
                motionDelay--;
                numMotion.innerHTML = motionDelay;

                if (motionDelay <= 0) {
                    clearInterval(countdownInterval);
                    numMotion.innerHTML = "00";
                    numMotion.style.color = "#aaa"; 
                    
                    let runTime = targetDuration;
                    numRun.innerHTML = runTime;
                    numRun.style.color = "#28a745"; 

                    runningInterval = setInterval(() => {
                        runTime--;
                        numRun.innerHTML = runTime;

                        if (runTime <= 0) {
                            clearInterval(runningInterval);
                            numRun.innerHTML = "00";
                            numRun.style.color = "#00ffcc"; 
                            document.getElementById('customWheel').value = ""; 
                            alert("✅ اكتملت المهمة وتم إيقاف المحرك تلقائياً!");
                        }
                    }, 1000);
                }
            }, 1000);
        }

        function runDiagnosticCheck() {
            const diagBox = document.getElementById('diagResult');
            const errors = [
                "تم كشف تماس كهربائي مفاجئ في دائرة المحرك المباشر! ⚠️",
                "خطأ في الكود (ERR_CODE_404): منفذ القراءة لا يستجيب للشاحن. 🔌",
                "النظام سليم بالكامل، تم فحص الماوس والمحرك وتيار الطاقة مستقر. ✅"
            ];
            const randomCheck = errors[Math.floor(Math.random() * errors.length)];
            
            diagBox.innerHTML = randomCheck;
            if(randomCheck.includes("تماس") || randomCheck.includes("خطأ")) {
                diagBox.style.color = "#ff4d4d"; 
            } else {
                diagBox.style.color = "#4dff88"; 
            }
        }

        function toggleMusic() {
            isMusicPlaying = !isMusicPlaying;
            alert(isMusicPlaying ? "🎵 تم تشغيل الموسيقى الخلفية" : "🔇 تم إيقاف الموسيقى");
        }

        function triggerTranslation() {
            isArabic = !isArabic;
            const welcome = document.getElementById('welcomeMsg');
            const tMotion = document.getElementById('titleMotion');
            const tRun = document.getElementById('titleRun');
            
            if(!isArabic) {
                welcome.innerHTML = "Welcome to the Smart System UI";
                tMotion.innerHTML = "⏳ Motion Timer:";
                tRun.innerHTML = "⚙️ Motor Run Counter:";
                alert("Interface translated to English successfully!");
            } else {
                welcome.innerHTML = "أهلاً وسهلاً بك في المنظومة 👋";
                tMotion.innerHTML = "⏳ مؤقت الحركة:";
                tRun.innerHTML = "⚙️ عداد تشغيل المحرك:";
                alert("تم إعادة واجهة التحكم للغة العربية!");
            }
        }
    </script>
</body>
</html>

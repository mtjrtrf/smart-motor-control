<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الطبلة الميكانيكي الذكي</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .welcome-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
            position: relative;
        }
        h1 {
            color: #2ecc71;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }
        p {
            color: #b3b3b3;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }
        .btn:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }
        /* أيقونة الإعدادات */
        .settings-icon {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        html[dir="ltr"] .settings-icon {
            left: auto;
            right: 15px;
        }
        .settings-icon:hover {
            transform: rotate(90deg);
        }
        /* نافذة الإعدادات المنبثقة */
        .settings-panel {
            display: none;
            position: absolute;
            top: 50px;
            left: 15px;
            background-color: #252525;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 10px;
            text-align: right;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 200px;
        }
        html[dir="ltr"] .settings-panel {
            left: auto;
            right: 15px;
            text-align: left;
        }
        .settings-panel h3 {
            margin-top: 0;
            font-size: 16px;
            color: #2ecc71;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .setting-item {
            margin-bottom: 12px;
        }
        .setting-item label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #ccc;
        }
        .lang-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 5px;
        }
        .lang-btn.active {
            background-color: #2ecc71;
            border-color: #2ecc71;
        }
        .volume-slider {
            width: 100%;
            accent-color: #2ecc71;
        }
        .audio-btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <div class="welcome-card">
        <div class="settings-icon" onclick="toggleSettings()">⚙️</div>

        <div class="settings-panel" id="settingsPanel">
            <h3 id="set-title">⚙️ الإعدادات</h3>
            
            <div class="setting-item">
                <label id="lang-label">اللغة / Language:</label>
                <button class="lang-btn active" id="btn-ar" onclick="changeLanguage('ar')">العربية</button>
                <button class="lang-btn" id="btn-en" onclick="changeLanguage('en')">English</button>
            </div>
            
            <div class="setting-item">
                <label id="audio-label">الموسيقى الخلفية:</label>
                <button class="audio-btn" id="btn-music" onclick="toggleMusic()">تشغيل الصوت 🎵</button>
            </div>
            
            <div class="setting-item">
                <label id="volume-label">مستوى الصوت:</label>
                <input type="range" class="volume-slider" id="volumeControl" min="0" max="1" step="0.1" value="0.5" oninput="setVolume(this.value)">
            </div>
        </div>

        <h1 id="main-title">✨ أهلاً وسهلاً بك في نظام الطبلة الميكانيكي الذكي ✨</h1>
        <p id="main-desc">👇 اضغط هنا لبدء الاتصال بالمنفذ 👇</p>
        <button class="btn" id="main-btn" onclick="triggerAlert()">دخول لوحة التحكم</button>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const panel = document.getElementById('settingsPanel');
        
        // تعيين الصوت الافتراضي إلى 50%
        music.volume = 0.5;

        // إظهار وإخفاء قائمة الإعدادات
        function toggleSettings() {
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'block';
            }
        }

        // تشغيل وإيقاف الصوت
        function toggleMusic() {
            const btn = document.getElementById('btn-music');
            const isArabic = document.documentElement.lang === 'ar';
            if (music.paused) {
                music.play().catch(e => console.log("تحتاج للتفاعل مع الصفحة أولاً لتشغيل الصوت"));
                btn.textContent = isArabic ? "إيقاف الصوت ⏸️" : "Mute Audio ⏸️";
                btn.style.backgroundColor = "#e74c3c";
            } else {
                music.pause();
                btn.textContent = isArabic ? "تشغيل الصوت 🎵" : "Play Audio 🎵";
                btn.style.backgroundColor = "#444";
            }
        }

        // تغيير مستوى الصوت
        function setVolume(val) {
            music.volume = val;
        }

        // تنبيه عند الضغط على الزر الرئيسي
        function triggerAlert() {
            const isArabic = document.documentElement.lang === 'ar';
            alert(isArabic ? 'جاري الاتصال بالمنفذ الميكانيكي...' : 'Connecting to mechanical port...');
        }

        // تغيير اللغة ديناميكياً بدون إعادة تحميل الصفحة
        function changeLanguage(lang) {
            const html = document.documentElement;
            const btnAr = document.getElementById('btn-ar');
            const btnEn = document.getElementById('btn-en');
            const musicBtn = document.getElementById('btn-music');

            if (lang === 'ar') {
                html.lang = 'ar';
                html.dir = 'rtl';
                btnAr.classList.add('active');
                btnEn.classList.remove('active');
                
                // تحديث النصوص للعربية
                document.getElementById('set-title').textContent = "⚙️ الإعدادات";
                document.getElementById('lang-label').textContent = "اللغة:";
                document.getElementById('audio-label').textContent = "الموسيقى الخلفية:";
                document.getElementById('volume-label').textContent = "مستوى الصوت:";
                document.getElementById('main-title').textContent = "✨ أهلاً وسهلاً بك في نظام الطبلة الميكانيكي الذكي ✨";
                document.getElementById('main-desc').textContent = "👇 اضغط هنا لبدء الاتصال بالمنفذ 👇";
                document.getElementById('main-btn').textContent = "دخول لوحة التحكم";
                if(!music.paused) musicBtn.textContent = "إيقاف الصوت ⏸️";
                else musicBtn.textContent = "تشغيل الصوت 🎵";
            } else {
                html.lang = 'en';
                html.dir = 'ltr';
                btnEn.classList.add('active');
                btnAr.classList.remove('active');
                
                // تحديث النصوص للإنجليزية
                document.getElementById('set-title').textContent = "⚙️ Settings";
                document.getElementById('lang-label').textContent = "Language:";
                document.getElementById('audio-label').textContent = "Background Music:";
                document.getElementById('volume-label').textContent = "Volume Level:";
                document.getElementById('main-title').textContent = "✨ Welcome to the Smart Mechanical Drum System ✨";
                document.getElementById('main-desc').textContent = "👇 Click below to connect to the port 👇";
                document.getElementById('main-btn').textContent = "Enter Control Panel";
                if(!music.paused) musicBtn.textContent = "Mute Audio ⏸️";
                else musicBtn.textContent = "Play Audio 🎵";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منظومة التحكم المتكاملة [STOP]</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        .main-box { background: #1e1e1e; border: 2px solid #333; border-radius: 15px; padding: 25px; width: 90%; max-width: 550px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #00fff0; font-size: 24px; }
        .traffic-light { display: flex; justify-content: space-around; background: #000; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .light-box { opacity: 0.2; transition: 0.4s; text-align: center; }
        .light-box.active { opacity: 1; }
        .circle { width: 45px; height: 45px; border-radius: 50%; margin: 0 auto 5px; }
        .red-circle { background: #ff4d4d; box-shadow: 0 0 15px #ff4d4d; }
        .green-circle { background: #4dff88; box-shadow: 0 0 15px #4dff88; }
        .screen { background: #000; border: 1px solid #555; border-radius: 8px; padding: 12px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .screen-num { font-size: 36px; font-weight: bold; font-family: monospace; }
        .section-title { font-size: 14px; color: #aaa; text-align: right; margin-top: 15px; margin-bottom: 5px; font-weight: bold; }
        .btn-zone { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .action-btn { background: #222; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px 18px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: #00ffcc; color: #000; }
        .start-btn { background: #28a745; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 100%; }
        .custom-input { background: #000; color: #fff; border: 1px solid #555; padding: 8px; border-radius: 6px; width: 70px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div class="main-box">
        <h1>منظومة التحكم المتكاملة ⚡</h1>
        
        <div class="traffic-light">
            <div id="stopLight" class="light-box active"><div class="circle red-circle"></div><span style="color: #ff4d4d; font-weight:bold;">إيقاف الحركة (0V)</span></div>
            <div id="runLight" class="light-box"><div class="circle green-circle"></div><span style="color: #4dff88; font-weight:bold;">تشغيل المحرك (5V)</span></div>
        </div>

        <div class="screen">
            <span>⏳ مؤقت التوقيف التنازلي:</span>
            <span id="stopTimer" class="screen-num" style="color: #ff4d4d;">00</span>
        </div>
        <div class="screen">
            <span>⚙️ مؤقت تشغيل المحرك:</span>
            <span id="runTimer" class="screen-num" style="color: #4dff88;">00</span>
        </div>

        <div class="section-title">🛑 اختر وقت إيقاف الحركة:</div>
        <div class="btn-zone">
            <button class="action-btn" onclick="setStopTime(10)">10 ثواني</button>
            <button class="action-btn" onclick="setStopTime(100)">100 ثانية</button>
            <input type="number" id="customStopInput" class="custom-input" placeholder="مخصص">
        </div>

        <div class="section-title">🟢 اختر وقت تشغيل المحرك:</div>
        <div class="btn-zone">
            <button class="action-btn" onclick="setRunTime(1)">1 ثانية</button>
            <button class="action-btn" onclick="setRunTime(10)">10 ثواني</button>
            <button class="action-btn" onclick="setRunTime(100)">100 ثانية</button>
            <input type="number" id="customRunInput" class="custom-input" min="1" max="100" placeholder="1-100">
        </div>

        <button class="start-btn" onclick="launchSystem()">🚀 إطلاق المنظومة الحقيقية</button>
    </div>

    <script>
        let stopInterval, runInterval;
        let selectedStopTime = 10; // القيمة الافتراضية
        let selectedRunTime = 1;   // القيمة الافتراضية

        // نظام توليد النغمات الصوتية الحماسية برمجياً
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function setStopTime(val) { selectedStopTime = val; alert("تم تحديد وقت الإيقاف: " + val + " ثانية"); }
        function setRunTime(val) { selectedRunTime = val; alert("تم تحديد وقت التشغيل: " + val + " ثانية"); }

        function launchSystem() {
            clearInterval(stopInterval); clearInterval(runInterval);
            
            // قراءة القيم المخصصة في حال إدخالها من المستخدم
            let customStop = document.getElementById('customStopInput').value;
            let customRun = document.getElementById('customRunInput').value;
            
            if(customStop) selectedStopTime = parseInt(customStop);
            if(customRun) {
                let runVal = parseInt(customRun);
                if(runVal >= 1 && runVal <= 100) selectedRunTime = runVal;
            }

            let stopTime = selectedStopTime; let runTime = selectedRunTime;
            
            // نغمة البداية والانطلاق
            playTone(220, "sawtooth", 0.3);

            // --- المرحلة الأولى: تشغيل مؤقت التوقيف (إشارة STOP للباتش) ---
            document.title = "منظومة التحكم المتكاملة [STOP]";
            document.getElementById('stopLight').className = "light-box active";
            document.getElementById('runLight').className = "light-box";
            document.getElementById('stopTimer').innerText = stopTime;
            document.getElementById('runTimer').innerText = "00";

            stopInterval = setInterval(() => {
                stopTime--; document.getElementById('stopTimer').innerText = stopTime;
                playTone(440, "sine", 0.05); // تكة العداد أثناء التوقف

                if(stopTime <= 0) {
                    clearInterval(stopInterval);
                    document.getElementById('stopTimer').innerText = "00";

                    // --- المرحلة الثانية: الانتقال التلقائي لمؤقت التشغيل (إشارة RUN للباتش) ---
                    document.title = "منظومة التحكم المتكاملة [RUN]";
                    document.getElementById('stopLight').className = "light-box";
                    document.getElementById('runLight').className = "light-box active";
                    document.getElementById('runTimer').innerText = runTime;
                    
                    playTone(880, "triangle", 0.5); // نغمة فتح التيار وبدء الحركة الحقيقية

                    runInterval = setInterval(() => {
                        runTime--; document.getElementById('runTimer').innerText = runTime;
                        playTone(587, "square", 0.08); // الموسيقى النبضية أثناء عمل المحرك

                        if(runTime <= 0) {
                            clearInterval(runInterval);
                            document.getElementById('runTimer').innerText = "00";
                            document.getElementById('runLight').className = "light-box";
                            
                            // إرجاع الإشارة لـ STOP فوراً للأمان بعد انتهاء الدورة
                            document.title = "منظومة التحكم المتكاملة [STOP]";
                            playTone(440, "sine", 0.2);
                            alert("✅ اكتملت الدورة بنجاح وتوقف المحرك تلقائياً!");
                        }
                    }, 1000);
                }
            }, 1000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الطبلة الميكانيكي الذكي</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .welcome-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
        }
        h1 {
            color: #2ecc71;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }
        p {
            color: #b3b3b3;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }
        .btn:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>✨ أهلاً وسهلاً بك في نظام الطبلة الميكانيكي الذكي ✨</h1>
        <p>👇 اضغط هنا لبدء الاتصال بالمنفذ 👇</p>
        <button class="btn" onclick="alert('جاري الاتصال بالمنفذ الميكانيكي...')">دخول لوحة التحكم</button>
    </div>

</body>
</html>
